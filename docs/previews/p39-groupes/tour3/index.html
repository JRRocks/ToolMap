<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P39 — Opération : maquettes, tour 3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
:root{--pg-bg:#ffffff;--pg-on:#122027;--pg-on2:#506169;--pg-line:#D5DEE2;--petrol:#163A4A;--teal:#14918C;--tile:#E2ECEF}
*{box-sizing:border-box}
body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#DDE5E8;color:var(--pg-on);-webkit-font-smoothing:antialiased}
#p39-root{width:660px;margin:0 auto}
.intro,section.shot{width:660px;background:var(--pg-bg);padding:18px 14px 20px;margin:0 0 14px}
.intro h1{font-size:22px;line-height:28px;font-weight:500;margin:0 0 8px;color:var(--petrol)}
.intro p,.intro li{font-size:14.5px;line-height:21px;color:var(--pg-on2);margin:6px 0}
.intro ul{margin:4px 0;padding-left:20px}
.intro b{color:var(--pg-on);font-weight:500}
.chapter{width:660px;background:var(--petrol);color:#fff;padding:14px;margin:0 0 14px;font-size:19px;line-height:25px;font-weight:500}
.chapter small{display:block;font-size:14px;line-height:20px;font-weight:400;color:#C9D6DC;margin-top:2px}
section.shot>header{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.num{flex:none;min-width:40px;height:40px;padding:0 6px;border-radius:20px;background:var(--petrol);color:#fff;font-size:19px;font-weight:500;display:flex;align-items:center;justify-content:center}
section.shot h2{font-size:20px;line-height:26px;font-weight:500;margin:0;color:var(--petrol)}
section.shot header p{font-size:14.5px;line-height:21px;color:var(--pg-on2);margin:4px 0 0}
section.shot header p b,.txt b,.note b{color:var(--pg-on);font-weight:500}
.fname{font-size:12px;line-height:16px;color:#7C8A90;margin-top:12px;text-align:right}
.duo{display:flex;gap:16px;align-items:flex-start;justify-content:center;margin-top:6px}
.duo+.duo{margin-top:18px}
.phc{margin:0;width:308px;flex:none}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:13px;font-size:13.5px;font-weight:500;margin-bottom:8px;white-space:nowrap}
.tag.cur{background:#E2ECEF;color:#163A4A}
.tag.new{background:#14918C;color:#fff}
.tag.reco{background:#163A4A;color:#fff}
.tag.night{background:#0C1A20;color:#7FD6D1}
.k-ph{width:308px;height:648px;overflow:hidden;border-radius:22px;border:1px solid #9FB1B8;position:relative;background:#000}
.k-in{width:360px;height:760px;transform:scale(.8556);transform-origin:0 0;position:relative;overflow:hidden;font-family:Roboto,system-ui,sans-serif}
.phc figcaption{font-size:13.5px;line-height:19px;color:var(--pg-on2);margin-top:8px}
.phc figcaption b{color:var(--pg-on);font-weight:500}
.txt{flex:1;min-width:0;font-size:14.5px;line-height:21px;color:var(--pg-on2);padding-top:34px}
.txt h3,.note h3{font-size:16px;line-height:22px;font-weight:500;color:var(--petrol);margin:14px 0 4px}
.txt h3:first-child{margin-top:0}
.txt p{margin:4px 0}.txt ul,.note ul{margin:4px 0;padding-left:20px}.txt li,.note li{margin:3px 0}
.note{margin-top:16px;padding:12px 14px;border-radius:14px;background:#F2F5F6;font-size:14.5px;line-height:21px;color:var(--pg-on2)}
.note.reco{background:#D3EEEC;color:#0B5B57}.note.reco b{color:#06302E}
.note.ask{background:#FBDCC2;color:#3A1E05}.note.ask b{color:#3A1E05}
.note h3:first-child{margin-top:0}
.sub{font-size:16px;line-height:22px;font-weight:500;color:var(--petrol);margin:20px 0 8px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role{border-radius:14px;background:#F2F5F6;padding:10px 12px;display:flex;gap:10px}
.role .ri{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.role .rn{font-size:15px;font-weight:500;line-height:20px;color:var(--pg-on)}
.role .rd{font-size:13px;line-height:18px;color:var(--pg-on2);margin-top:2px}
table.rights{width:100%;border-collapse:collapse;font-size:13.5px;line-height:18px}
table.rights th{font-size:11.5px;line-height:14px;font-weight:500;color:var(--pg-on);padding:6px 2px;vertical-align:bottom;width:64px;text-align:center}
table.rights th:first-child{text-align:left;width:auto;font-size:13px;color:var(--pg-on2)}
table.rights td{padding:7px 2px;border-top:1px solid var(--pg-line);text-align:center;color:var(--pg-on)}
table.rights td:first-child{text-align:left;padding-right:6px}
table.rights tr.sec td{background:#F2F5F6;font-weight:500;color:var(--petrol);font-size:13px;padding:5px 8px;text-align:left}
.ty,.tn,.tq{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:700}
.ty{background:#D3EEEC;color:#0B5B57}.tn{color:#9AA8AE}.tq{background:#FBDCC2;color:#3A1E05;font-size:11.5px;width:auto;min-width:24px;padding:0 6px;border-radius:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--pg-on2);margin-top:8px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.toc{margin:8px 0 0;padding:0;list-style:none;columns:2;column-gap:18px}
.toc li{font-size:14px;line-height:20px;margin:0 0 4px;break-inside:avoid}
.toc a{color:var(--petrol);text-decoration:none;font-weight:500}
@media (max-width:680px){#p39-root{zoom:calc(100vw / 660px)}}
section.shot h2{overflow-wrap:normal;word-break:normal;hyphens:none}
.qs{margin:8px 0 0;padding:0;list-style:none}
.qs li{font-size:14.5px;line-height:21px;color:var(--pg-on2);margin:0 0 10px}
.qs li b{color:var(--pg-on);font-weight:500}

</style>
</head>

  K.page = function (cfg) {

      pts.push([cx + rx * k * Math.cos(a), cy + ry * k * Math.sin(a)]);
    }
    let d = '';
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      if (!i) d += `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
      d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }

  let woods = '', lines = '', houses = '';

  [[70, 150, 9], [290, 600, 8], [205, 330, 6]].forEach((top) => {
    const ph = seed;
    for (let k = 1; k <= top[2]; k++) {
      seed = ph; // the same wobble for every line of one top, so that the lines never cross
      lines += `<path d="${blob(top[0], top[1], 16 * k, 13 * k, 0.16, 18)}" fill="none" stroke="#C89F74" stroke-width="${k % 4 === 0 ? 1.1 : 0.55}" opacity=".8"/>`;
    }

  const road = 'M-10 700 C60 640 90 560 150 500 S220 380 200 300 S230 150 250 -10';
  const small1 = 'M150 500 C200 520 250 500 300 520 S350 540 370 530';
  const small2 = 'M200 300 C150 290 100 320 60 300 S10 250 -10 260';
  const track1 = 'M60 300 C70 380 40 450 70 520 S120 600 100 680';
  const track2 = 'M250 90 C270 140 300 170 320 230';

  let grid = '';

  [110, 290, 470, 650].forEach((y) => { grid += `<path d="M0 ${y}H360" stroke="#4A7FC4" stroke-width=".6" opacity=".45"/>`; });
  return `<svg width="360" height="760" viewBox="0 0 360 760" style="display:block;position:absolute;left:0;top:0"><rect width="360" height="760" fill="#F3F2E6"/>${woods}${lines}` +
    `<path d="${river}" fill="none" stroke="#8DBDE8" stroke-width="8" stroke-linecap="round"/><path d="${blob(292, 392, 26, 17, 0.2, 12)}" fill="#8DBDE8"/>` +
    `<path d="${track1}" fill="none" stroke="#6B5B4B" stroke-width="1.1" stroke-dasharray="5 3"/><path d="${track2}" fill="none" stroke="#6B5B4B" stroke-width="1.1" stroke-dasharray="5 3"/>` +

/* Windows and sheets are moved a few pixels so that their edge never cuts a line of text, an icon or a token of
 * the screen underneath (nor shows one through a rounded corner). */
function settle() {
  document.querySelectorAll('.k-in').forEach((ph) => {
    const box = ph.querySelector('[data-dlg]') || ph.querySelector('[data-sheet]');
    if (!box) return;
    const P0 = ph.getBoundingClientRect(), scale = P0.width / 360;
    const isDlg = box.hasAttribute('data-dlg');
    if (!isDlg) { // a sheet over a map: what its upper edge would cut in two is under the sheet
      const top = box.getBoundingClientRect().top;
      ph.querySelectorAll('[data-tk],[data-mlt]').forEach((el) => {
        const r = el.getBoundingClientRect();
        if (r.bottom <= top - 2 * scale) return;
        el.style.visibility = 'hidden';
        const n = el.dataset.tk;
        if (n) ph.querySelectorAll(`[data-ml="${n}"]`).forEach((l) => { l.style.visibility = 'hidden'; });
      });
    }
    const rects = [];
    const walker = document.createTreeWalker(ph, NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      if (!n.nodeValue.trim() || box.contains(n)) continue;
      const r = document.createRange(); r.selectNodeContents(n);
      for (const c of r.getClientRects()) if (c.width > 0 && c.height > 0) rects.push(c);
    }
    ph.querySelectorAll('svg, [style*="border-radius:50%"], [style*="border-radius:16px;background"]').forEach((el) => { // icons, tokens, switches
      if (box.contains(el)) return;
      const c = el.getBoundingClientRect();
      if (c.width > 0 && c.width < 70 * scale && c.height < 70 * scale) rects.push(c);
    });
    const b0 = box.getBoundingClientRect(), tol = 1.5 * scale, band = 9 * scale, side = 20 * scale;
    const over = (c) => c.right > b0.left && c.left < b0.right;
    const corner = (c) => c.left < b0.left + side || c.right > b0.right - side;
    const cutsTop = (e) => rects.some((c) => over(c) && ((c.top + tol < e && c.bottom - tol > e) || (corner(c) && c.bottom - tol > e && c.top < e + band)));
    const cutsBottom = (e) => rects.some((c) => over(c) && ((c.top + tol < e && c.bottom - tol > e) || (corner(c) && c.top + tol < e && c.bottom > e - band)));
    let best = null;
    if (isDlg) {
      for (let dy = -70; dy <= 70; dy += 2) {
        const top = b0.top + dy * scale;
        if ((top - P0.top) / scale < 96 || cutsTop(top)) continue;
        for (let e = 0; e <= 40; e += 2) {
          const bottom = b0.bottom + (dy + e) * scale;
          if ((bottom - P0.top) / scale > 744) break;
          if (cutsBottom(bottom)) continue;
          const cost = Math.abs(dy) + 5 * e;
          if (!best || cost < best.cost) best = { dy, e, cost };
          break;
        }
      }
      if (best) { box.style.top = (parseFloat(box.style.top) + best.dy) + 'px'; if (best.e) box.style.paddingBottom = (16 + best.e) + 'px'; }
    } else {
      for (let e = 0; e <= 48; e += 2) if (!cutsTop(b0.top - e * scale)) { if (e) box.style.paddingBottom = (16 + e) + 'px'; break; }
    }
  });
}
const ready = () => { settle(); window.P39_READY = true; };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(ready)); else ready();
