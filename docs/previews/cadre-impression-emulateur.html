<script>
const W=210,H=455;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.size||11}" fill="${o.fill||'#e8eaed'}" text-anchor="${o.a||'start'}" font-weight="${o.b?500:400}" font-family="sans-serif">${s}</text>`;
const panel=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="#20242b" fill-opacity="0.9"/>`;
function map(){let s=`<rect width="${W}" height="${H}" fill="#d9e3bf"/>`;
for(let i=0;i<9;i++){const y=20+i*52;s+=`<path d="M0 ${y} C60 ${y-14} 120 ${y+18} ${W} ${y-6}" stroke="#b9a27a" stroke-width="0.8" fill="none" opacity="0.7"/>`}
s+=`<path d="M150 0 C140 120 120 220 95 ${H}" stroke="#7fb3d5" stroke-width="3" fill="none"/>`;
for(let x=18;x<W;x+=46)s+=`<line x1="${x}" y1="0" x2="${x+6}" y2="${H}" stroke="#4f5f68" stroke-width="0.7" opacity="0.7"/>`;
for(let y=30;y<H;y+=46)s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y+3}" stroke="#4f5f68" stroke-width="0.7" opacity="0.7"/>`;
s+=`<line x1="118" y1="0" x2="118" y2="${H}" stroke="#1c2429" stroke-width="2.4"/>`;return s}
function frame(fy){const fx=34,fw=150,fh=84;return `<path d="M0 0H${W}V${H}H0Z M${fx} ${fy}v${fh}h${fw}v${-fh}Z" fill="#000" fill-opacity="0.35" fill-rule="evenodd"/><rect x="${fx}" y="${fy}" width="${fw}" height="${fh}" fill="none" stroke="#a8c7fa" stroke-width="1.6"/><line x1="${fx+fw/2-5}" y1="${fy+fh/2}" x2="${fx+fw/2+5}" y2="${fy+fh/2}" stroke="#a8c7fa"/><line x1="${fx+fw/2}" y1="${fy+fh/2-5}" x2="${fx+fw/2}" y2="${fy+fh/2+5}" stroke="#a8c7fa"/>`+T(fx+30,fy+14,'31T GL',{fill:'#263238',b:1})+T(fx+100,fy+14,'32T KR',{fill:'#263238',b:1})}
function chips(y){let s='';[['A4',8,44],['Paysage',56,68],['1:25 000',128,70]].forEach(([t,x,w])=>{s+=`<rect x="${x+6}" y="${y}" width="${w}" height="22" rx="5" fill="none" stroke="#8e9099" stroke-width="0.8"/>`+T(x+12,y+15,t)+`<path d="M${x+w-6} ${y+9}l4 5l4-5z" fill="#e8eaed"/>`});return s}
function bottom(){return `<rect x="0" y="${H-64}" width="${W}" height="64" rx="10" fill="#1b1f26"/>`+T(10,H-48,'Glissez le cadre pour le placer ;')+T(10,H-35,'la carte se déplace autour.')+`<rect x="10" y="${H-26}" width="90" height="20" rx="10" fill="none" stroke="#8e9099"/>`+T(55,H-12,'Annuler',{a:'middle'})+`<rect x="110" y="${H-26}" width="90" height="20" rx="10" fill="#a8c7fa"/>`+T(155,H-12,'Suivant',{a:'middle',fill:'#0b1d36',b:1})}
