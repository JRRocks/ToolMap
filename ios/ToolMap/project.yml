# ToolMap for iPhone (P32, ADR-100, docs/plan-ios.md). XcodeGen writes ToolMap.xcodeproj from this file on the macOS
# runner (.github/workflows/ios.yml): no Xcode project file is kept in the repository.
name: ToolMap
options:
  bundleIdPrefix: fr.toolmap
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ToolMapCore:
    path: ../ToolMapCore
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The iOS version, shown in the menu and used for the ios-<version> release (ADR-099).
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    # No Apple Developer account yet (P32.13): simulator builds only, signed to run locally.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ToolMap:
    type: application
    platform: iOS
    # A shared scheme, so that xcodebuild finds it on the runner.
    scheme: {}
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: ToolMapCore
      - package: MapLibre
        product: MapLibre
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ToolMap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: ToolMap affiche votre position sur la carte et l'enregistre dans vos traces.
        NSLocationAlwaysAndWhenInUseUsageDescription: ToolMap continue d'enregistrer votre trace et de partager votre position écran éteint, quand vous le lui demandez.
        NSMotionUsageDescription: ToolMap lit le baromètre pour calculer l'altitude.
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
        # « Ouvrir avec » (Android P1.7, P5.2): the map and track files ToolMap reads, from Files, Mail or AirDrop.
        LSSupportsOpeningDocumentsInPlace: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: fr.toolmap.aqx
            UTTypeDescription: Carte AlpineQuest
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [aqx]
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: Trace GPX
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
          - UTTypeIdentifier: com.google.earth.kml
            UTTypeDescription: Fichier KML
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [kml]
          - UTTypeIdentifier: com.google.earth.kmz
            UTTypeDescription: Fichier KMZ
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [kmz]
          - UTTypeIdentifier: fr.toolmap.mbtiles
            UTTypeDescription: Paquet de cartes MBTiles
            UTTypeConformsTo: [public.database, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mbtiles]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Carte AlpineQuest
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [fr.toolmap.aqx]
          - CFBundleTypeName: Traces
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx, com.google.earth.kml, com.google.earth.kmz, public.geojson]
          - CFBundleTypeName: Paquet de cartes
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [fr.toolmap.mbtiles]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.toolmap.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
