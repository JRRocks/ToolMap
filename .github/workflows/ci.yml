name: CI

on:
  push:
  pull_request:

permissions:
  # Creating the debug pre-release (step "Publish the debug APK"); deleting old artifacts (step "Delete old artifacts").
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The emulator check (below) adds a few minutes to the build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not left in .git/config, where the build and the tests it runs could read it (P36 review):
          # no step uses git after this one (gh and github-script get the token they need themselves).
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric fetches its Android jars from Maven Central into ~/.m2 on first use (ADR-013), outside Gradle and its
      # cache: on 2026-10-28 a failed download failed 16 test classes of :data before they ran. Kept between runs, the
      # jars are fetched once per Robolectric version.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      # The native compute engine (Rust, ADR-119) is built with the linker of the NDK, by the Rust and the Android
      # targets pinned in engine/src/main/rust/rust-toolchain.toml (rustup installs them on first use). Kept between
      # runs: the NDK (700 MB to download), the toolchain, the crates and what cargo has compiled.
      - name: Keep the NDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk/ndk
          key: ndk-${{ hashFiles('scripts/install-android-sdk.sh') }}

      - name: Keep Rust and its build
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
            ~/.cargo/registry
            engine/build/rust
          key: rust-${{ hashFiles('engine/src/main/rust/rust-toolchain.toml', 'engine/src/main/rust/Cargo.lock') }}-${{ hashFiles('engine/src/main/rust/src/**') }}
          restore-keys: |
            rust-${{ hashFiles('engine/src/main/rust/rust-toolchain.toml', 'engine/src/main/rust/Cargo.lock') }}-

      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          ANDROID_HOME="$HOME/android-sdk" ./scripts/install-android-sdk.sh
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      # The publication key (ADR-047) signs the debug APK too, so that no APK handed out is signed by the public debug key.
      # Without the secret, the build falls back to the public key, and the run says so.
      - name: Publication key (only when the secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.TOOLMAP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/publication.jks"
            echo "TOOLMAP_KEYSTORE_FILE=$RUNNER_TEMP/publication.jks" >> "$GITHUB_ENV"
            echo "APK_SIGNER=publication" >> "$GITHUB_ENV"
            echo "The debug APK is signed with the publication key."
          else
            echo "APK_SIGNER=debug" >> "$GITHUB_ENV"
            echo "::warning::No publication key in the secrets: the debug APK is signed with the public debug key."
          fi

      # The import of the problem reports into issues (ADR-116), checked without network.
      - name: Problem import tests
        run: node --test tools/problems/reports.test.mjs

      - name: Style, lint, unit tests, debug APK
        env:
          # Optional: the coordination server built into the APK (repository secrets; empty = none built in).
          TOOLMAP_FIREBASE_DB_URL: ${{ secrets.TOOLMAP_FIREBASE_DB_URL }}
          TOOLMAP_FIREBASE_API_KEY: ${{ secrets.TOOLMAP_FIREBASE_API_KEY }}
          # Read by app/build.gradle.kts only when the publication key was decoded by the step above.
          TOOLMAP_KEYSTORE_PASSWORD: ${{ secrets.TOOLMAP_KEYSTORE_PASSWORD }}
          TOOLMAP_KEY_ALIAS: ${{ secrets.TOOLMAP_KEY_ALIAS }}
          TOOLMAP_KEY_PASSWORD: ${{ secrets.TOOLMAP_KEY_PASSWORD }}
        run: ./gradlew check assembleDebug

      # The signer of the APK, as the SHA-256 of its certificate (public, not a secret). It changes when the publication
      # key starts signing (ADR-047): docs/specs/release.md §2 gives the fingerprint of the public debug key to compare with.
      - name: Show the signer of the debug APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/ToolMap-debug-*.apk

      # No version is published before it ran on an emulator (CLAUDE.md, ADR-117): the APK just built is installed and
      # started; a crash, an ANR, the crash report screen or no map screen fails the job before any publication below
      # (artifact, pre-release, release). Cloud sessions have no emulator of their own: this is their check.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The system image of the emulator (1.5 GB) and the emulator itself are kept between runs. Downloaded at each run,
      # the image once came cut short (« Failed to download package archive », run 42693133222 of 2026-11-09): the check
      # could not run and nothing was published for that commit. With the cache the installer finds them in place.
      - name: Keep the emulator and its system image
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/system-images/android-34
            ~/android-sdk/emulator
          key: emulator-api34-google_apis-x86_64-v1

      - name: Check the APK on an emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/emulator/smoke.sh app/build/outputs/apk/debug emulator-check

      # The screenshot, window dump and log of the check, also when it failed (what to look at).
      - name: Upload the emulator check
        if: always() && steps.emulator.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emulator-check
          path: emulator-check/
          if-no-files-found: ignore
          retention-days: 14

      # The account has 0.5 GB of artifact storage for all its repositories (docs/specs/release.md §1). This run deletes the
      # older debug APK artifacts and the old failure reports before it uploads its own, so one APK is kept, not two.
      # Release artifacts are left alone. Push events only: Dependabot and pull requests from forks get a read-only token.
      - name: Delete old artifacts
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const kept = new Set(["toolmap-debug-apk", "reports", "emulator-check"]);
            // This run's own emulator check was just uploaded: it stays.
            const old = all.filter((a) => kept.has(a.name) && !a.expired && a.workflow_run?.id !== context.runId);
            let freed = 0;
            for (const a of old) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              freed += a.size_in_bytes;
              core.info(`Deleted ${a.name} ${a.id} (${(a.size_in_bytes / 1e6).toFixed(1)} MB, run ${a.workflow_run?.id})`);
            }
            core.info(`Deleted ${old.length} artifacts, ${(freed / 1e6).toFixed(1)} MB; this run's upload is the only APK kept.`);

      # Release assets are not counted in the Actions storage quota, so the APK also goes to a pre-release tagged with the
      # commit (debug-<sha7>), titled with its version. Only the newest debug pre-release is kept, as for the artifacts.
      # Pushes to main only: the app offers the newest of these pre-releases as its update (P31, ADR-094), so a work
      # branch must not publish one; its APK is the artifact below.
      - name: Publish the debug APK
        id: publish-apk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-${GITHUB_SHA::7}"
          apk="$(ls app/build/outputs/apk/debug/ToolMap-debug-*.apk)"
          # The version is the one in the APK name (ToolMap-debug-<version>.apk, from appVersionName).
          version="$(basename "$apk" .apk)"
          version="${version#ToolMap-debug-}"
          if [ "$APK_SIGNER" = "publication" ]; then
            signed="signé avec la clé de publication de ToolMap (secret du dépôt)"
          else
            signed="signé avec la clé de debug publique : aucune clé de publication dans les secrets"
          fi
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease \
            --title "ToolMap debug $version (${GITHUB_SHA::7})" \
            --notes "APK de debug $version compilé depuis le commit ${GITHUB_SHA}, $signed. Une installation signée par une autre clé doit être désinstallée une fois."
          for old in $(gh release list --limit 100 --json tagName -q '.[] | select(.tagName | startswith("debug-")) | .tagName'); do
            [ "$old" = "$tag" ] || gh release delete "$old" --cleanup-tag --yes
          done

      # Every push (any branch but Dependabot's) also publishes its APK as the release android-<version>, and only the two
      # newest versions are kept (ADR-099). The app ignores these tags (it reads debug-* only, ADR-094); the Windows
      # workstation copies them to the Drive (scripts/drive-mirror.ps1). A version already published is kept as it is,
      # and a version older than the two published ones is not published.
      - name: Publish the Android release
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'dependabot/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(ls app/build/outputs/apk/debug/ToolMap-debug-*.apk)"
          version="$(basename "$apk" .apk)"
          version="${version#ToolMap-debug-}"
          tag="android-$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published: kept as it is."
            exit 0
          fi
          published="$(gh release list --limit 100 --json tagName -q '.[].tagName | select(startswith("android-"))')"
          newest="$(printf '%s\n' $published "$tag" | sort -uVr | head -n 2)"
          if ! printf '%s\n' "$newest" | grep -qx "$tag"; then
            echo "$tag is older than the two published versions: not published."
            exit 0
          fi
          latest=false
          [ "$(printf '%s\n' "$newest" | head -n 1)" = "$tag" ] && latest=true
          if [ "$APK_SIGNER" = "publication" ]; then
            signed="signé avec la clé de publication de ToolMap"
          else
            signed="signé avec la clé de debug publique : aucune clé de publication dans les secrets"
          fi
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --latest="$latest" \
            --title "ToolMap Android $version" \
            --notes "APK $version compilé par la CI depuis le commit ${GITHUB_SHA} (branche ${GITHUB_REF_NAME}), $signed. Seules les deux dernières versions sont gardées ici ; toutes sont archivées sur le Drive."
          for old in $(printf '%s\n' $published "$tag" | sort -uVr | tail -n +3); do
            gh release delete "$old" --cleanup-tag --yes
          done

      # Not blocking: the account's storage quota can refuse the upload. The APK still reaches the pre-release published
      # above, which does not count in the quota (docs/specs/release.md §1, ADR-045).
      - name: Upload debug APK
        id: upload-apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: toolmap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Last check (ADR-046): a push must leave the APK somewhere. It passes when the artifact was uploaded, or when the
      # commit's pre-release already carries the APK (also on a re-run, where the release exists and the publish step fails).
      # It fails only when both are missing. Push events only: pull requests have no pre-release, and on a branch other
      # than main only the artifact can deliver the APK. Runs only while the blocking steps before it succeeded.
      - name: Check that the APK was delivered
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD: ${{ steps.upload-apk.outcome }}
          PUBLISH: ${{ steps.publish-apk.outcome }}
        run: |
          tag="debug-${GITHUB_SHA::7}"
          if [ "$UPLOAD" = "success" ]; then
            echo "APK delivered as the artifact toolmap-debug-apk."
            exit 0
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^ToolMap-debug-.*\.apk$'; then
            echo "APK delivered by the pre-release $tag (artifact upload: $UPLOAD, publish: $PUBLISH)."
            exit 0
          fi
          echo "::error::No APK delivered: artifact upload $UPLOAD, no APK in the pre-release $tag (publish $PUBLISH)."
          exit 1
