name: CI

on:
  push:
  pull_request:

permissions:
  # Creating the release android-<version> (step "Publish the Android release"); deleting old artifacts (step "Delete
  # old artifacts").
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The emulator check (below) adds a few minutes to the build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not left in .git/config, where the build and the tests it runs could read it (P36 review):
          # no step uses git after this one (gh and github-script get the token they need themselves).
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric fetches its Android jars from Maven Central into ~/.m2 on first use (ADR-013), outside Gradle and its
      # cache: on 2026-10-28 a failed download failed 16 test classes of :data before they ran. Kept between runs, the
      # jars are fetched once per Robolectric version.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      # The native compute engine (Rust, ADR-119) is built with the linker of the NDK, by the Rust and the Android
      # targets pinned in engine/src/main/rust/rust-toolchain.toml (rustup installs them on first use). Kept between
      # runs: the NDK (700 MB to download), the toolchain, the crates and what cargo has compiled.
      - name: Keep the NDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk/ndk
          key: ndk-${{ hashFiles('scripts/install-android-sdk.sh') }}

      - name: Keep Rust and its build
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
            ~/.cargo/registry
            engine/build/rust
          key: rust-${{ hashFiles('engine/src/main/rust/rust-toolchain.toml', 'engine/src/main/rust/Cargo.lock') }}-${{ hashFiles('engine/src/main/rust/src/**') }}
          restore-keys: |
            rust-${{ hashFiles('engine/src/main/rust/rust-toolchain.toml', 'engine/src/main/rust/Cargo.lock') }}-

      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          ANDROID_HOME="$HOME/android-sdk" ./scripts/install-android-sdk.sh
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      # The publication key (ADR-047) signs the release APK, the one that is published (ADR-121), and the debug APK too,
      # so that no APK handed out is signed by the public debug key. Without the secret (Dependabot, a fork), there is no
      # release APK (unsigned, it would not install) and nothing is published; the debug APK falls back to the public
      # key, and the run says so.
      - name: Publication key (only when the secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.TOOLMAP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/publication.jks"
            echo "TOOLMAP_KEYSTORE_FILE=$RUNNER_TEMP/publication.jks" >> "$GITHUB_ENV"
            echo "APK_SIGNER=publication" >> "$GITHUB_ENV"
            echo "RELEASE_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "The release APK and the debug APK are signed with the publication key."
          else
            echo "APK_SIGNER=debug" >> "$GITHUB_ENV"
            echo "RELEASE_TASK=" >> "$GITHUB_ENV"
            echo "::warning::No publication key in the secrets: no release APK, the debug APK is signed with the public debug key."
          fi

      # The import of the problem reports into issues (ADR-116), checked without network.
      - name: Problem import tests
        run: node --test tools/problems/reports.test.mjs

      - name: Style, lint, unit tests, debug APK, release APK
        env:
          # Optional: the coordination server built into the APK (repository secrets; empty = none built in).
          TOOLMAP_FIREBASE_DB_URL: ${{ secrets.TOOLMAP_FIREBASE_DB_URL }}
          TOOLMAP_FIREBASE_API_KEY: ${{ secrets.TOOLMAP_FIREBASE_API_KEY }}
          # Read by app/build.gradle.kts only when the publication key was decoded by the step above.
          TOOLMAP_KEYSTORE_PASSWORD: ${{ secrets.TOOLMAP_KEYSTORE_PASSWORD }}
          TOOLMAP_KEY_ALIAS: ${{ secrets.TOOLMAP_KEY_ALIAS }}
          TOOLMAP_KEY_PASSWORD: ${{ secrets.TOOLMAP_KEY_PASSWORD }}
        run: ./gradlew check assembleDebug $RELEASE_TASK

      # The signer of the APKs, as the SHA-256 of its certificate (public, not a secret). It changes when the publication
      # key starts signing (ADR-047): docs/specs/release.md §2 gives the fingerprint of the public debug key to compare with.
      - name: Show the signer of the APKs
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/*/ToolMap-*.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk"
          done

      # No version is published before it ran on an emulator (CLAUDE.md, ADR-117): each APK just built is installed and
      # started, the release APK (the one published) then the debug APK (the artifact); a crash, an ANR, the crash
      # report screen or no map screen fails the job before any publication below (artifact, release). Cloud sessions
      # have no emulator of their own: this is their check.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The system image of the emulator (1.5 GB) and the emulator itself are kept between runs. Downloaded at each run,
      # the image once came cut short (« Failed to download package archive », run 42693133222 of 2026-11-09): the check
      # could not run and nothing was published for that commit. With the cache the installer finds them in place.
      - name: Keep the emulator and its system image
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/system-images/android-34
            ~/android-sdk/emulator
          key: emulator-api34-google_apis-x86_64-v1

      - name: Check the APK on an emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            if [ -d app/build/outputs/apk/release ]; then bash tools/emulator/smoke.sh app/build/outputs/apk/release emulator-check/release; fi
            bash tools/emulator/smoke.sh app/build/outputs/apk/debug emulator-check

      # The screenshot, window dump and log of the check, also when it failed (what to look at).
      - name: Upload the emulator check
        if: always() && steps.emulator.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emulator-check
          path: emulator-check/
          if-no-files-found: ignore
          retention-days: 14

      # The account has 0.5 GB of artifact storage for all its repositories (docs/specs/release.md §1). This run deletes the
      # older debug APK artifacts and the old failure reports before it uploads its own, so one APK is kept, not two.
      # Release artifacts are left alone. Push events only: Dependabot and pull requests from forks get a read-only token.
      - name: Delete old artifacts
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const kept = new Set(["toolmap-debug-apk", "reports", "emulator-check"]);
            // This run's own emulator check was just uploaded: it stays.
            const old = all.filter((a) => kept.has(a.name) && !a.expired && a.workflow_run?.id !== context.runId);
            let freed = 0;
            for (const a of old) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              freed += a.size_in_bytes;
              core.info(`Deleted ${a.name} ${a.id} (${(a.size_in_bytes / 1e6).toFixed(1)} MB, run ${a.workflow_run?.id})`);
            }
            core.info(`Deleted ${old.length} artifacts, ${(freed / 1e6).toFixed(1)} MB; this run's upload is the only APK kept.`);

      # Every push (any branch but Dependabot's) publishes its release APK as the release android-<version>, and only the
      # two newest versions are kept (ADR-099). Since ADR-121 a release carries the release build type, never the debug
      # one: the debug APK is only the artifact below, and the debug-<sha7> pre-releases are gone. The app offers these
      # releases as its update (ADR-104); the Windows workstation copies them to the Drive (scripts/drive-mirror.ps1).
      # A version already published is kept as it is, and a version older than the two published ones is not published.
      # Release assets are not counted in the Actions storage quota.
      # Private design work (ADR-124): a branch that carries the file .conception-privee at its root publishes nothing,
      # whatever its name. Its APKs stay in the artifacts of the run. The file is removed when the work is merged.
      - name: Publish the Android release
        id: publish-apk
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'dependabot/') && env.APK_SIGNER == 'publication' && hashFiles('.conception-privee') == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -e .conception-privee ]; then
            echo "Private design branch (.conception-privee, ADR-124): nothing is published."
            exit 0
          fi
          apk="$(ls app/build/outputs/apk/release/ToolMap-release-*.apk)"
          version="$(basename "$apk" .apk)"
          version="${version#ToolMap-release-}"
          tag="android-$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published: kept as it is."
            exit 0
          fi
          published="$(gh release list --limit 100 --json tagName -q '.[].tagName | select(startswith("android-"))')"
          newest="$(printf '%s\n' $published "$tag" | sort -uVr | head -n 2)"
          if ! printf '%s\n' "$newest" | grep -qx "$tag"; then
            echo "$tag is older than the two published versions: not published."
            exit 0
          fi
          latest=false
          [ "$(printf '%s\n' "$newest" | head -n 1)" = "$tag" ] && latest=true
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --latest="$latest" \
            --title "ToolMap Android $version" \
            --notes "APK de release $version compilé par la CI depuis le commit ${GITHUB_SHA} (branche ${GITHUB_REF_NAME}), signé avec la clé de publication de ToolMap, contrôlé sur émulateur. Seules les deux dernières versions sont gardées ici, avec la version passerelle 0.4.231 ; toutes sont archivées sur le Drive."
          # android-0.4.231 is the bridge (ADR-122), never deleted: it also carries its release APK under the name
          # ToolMap-debug-0.4.231.apk, the only one the apps up to 0.4.230 read. They are offered 0.4.231, which reads
          # the releases above.
          for old in $(printf '%s\n' $published "$tag" | sort -uVr | tail -n +3); do
            [ "$old" = "android-0.4.231" ] && continue
            gh release delete "$old" --cleanup-tag --yes
          done

      # The debug APK, for the development phase only (ADR-121). Not blocking: the account's storage quota can refuse the
      # upload; the release APK published above does not count in the quota (docs/specs/release.md §1, ADR-045).
      - name: Upload debug APK
        id: upload-apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: toolmap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Last check (ADR-046): a push must leave an APK somewhere. It passes when the release of this version carries the
      # release APK (also on a re-run, or for a commit that does not change the version: the release exists already), or
      # when the debug artifact was uploaded. It fails only when both are missing. Push events only. Runs only while the
      # blocking steps before it succeeded.
      - name: Check that the APK was delivered
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD: ${{ steps.upload-apk.outcome }}
          PUBLISH: ${{ steps.publish-apk.outcome }}
        run: |
          version="$(basename "$(ls app/build/outputs/apk/debug/ToolMap-debug-*.apk)" .apk)"
          tag="android-${version#ToolMap-debug-}"
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^ToolMap-release-.*\.apk$'; then
            echo "Release APK delivered by the release $tag (publish: $PUBLISH, debug artifact: $UPLOAD)."
            exit 0
          fi
          if [ "$UPLOAD" = "success" ]; then
            echo "No release APK in $tag (publish: $PUBLISH); debug APK delivered as the artifact toolmap-debug-apk."
            exit 0
          fi
          echo "::error::No APK delivered: no release APK in $tag (publish $PUBLISH), artifact upload $UPLOAD."
          exit 1
