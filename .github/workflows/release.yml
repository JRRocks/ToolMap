name: Release

# Manual run, or a tag "v*": builds the release APKs and the Play bundle. Without the signing secrets the artifacts are
# unsigned (Play can sign an uploaded bundle; an unsigned APK cannot be installed). See docs/specs/release.md.
on:
  workflow_dispatch:
    inputs:
      minify:
        description: "Enable R8 (never tried on a phone yet)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.TOOLMAP_KEYSTORE_BASE64 }}
      TOOLMAP_KEYSTORE_PASSWORD: ${{ secrets.TOOLMAP_KEYSTORE_PASSWORD }}
      TOOLMAP_KEY_ALIAS: ${{ secrets.TOOLMAP_KEY_ALIAS }}
      TOOLMAP_KEY_PASSWORD: ${{ secrets.TOOLMAP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The token is not left in .git/config, where the build and the tests it runs could read it (P36 review):
          # no step uses git after this one (gh and github-script get the token they need themselves).
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The native compute engine (Rust, ADR-119) is built with the linker of the NDK, by the Rust and the Android
      # targets pinned in engine/src/main/rust/rust-toolchain.toml (rustup installs them on first use). Kept between
      # runs: the NDK (700 MB to download), the toolchain, the crates and what cargo has compiled.
      - name: Keep the NDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk/ndk
          key: ndk-${{ hashFiles('scripts/install-android-sdk.sh') }}

      - name: Keep Rust and its build
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
            ~/.cargo/registry
            engine/build/rust
          key: rust-${{ hashFiles('engine/src/main/rust/rust-toolchain.toml', 'engine/src/main/rust/Cargo.lock') }}-${{ hashFiles('engine/src/main/rust/src/**') }}
          restore-keys: |
            rust-${{ hashFiles('engine/src/main/rust/rust-toolchain.toml', 'engine/src/main/rust/Cargo.lock') }}-

      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          ANDROID_HOME="$HOME/android-sdk" ./scripts/install-android-sdk.sh
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Release keystore (only when the secrets exist)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TOOLMAP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No release key: the artifacts will be unsigned."
          fi

      - name: Build
        run: >
          ./gradlew assembleRelease bundleRelease
          -Ptoolmap.versionCode=${{ github.run_number }}
          -Ptoolmap.minify=${{ inputs.minify || 'false' }}

      # No version is published before it ran on an emulator (CLAUDE.md, ADR-117); an unsigned APK does not install,
      # so a release without its key is not published either.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The system image of the emulator (1.5 GB) and the emulator itself are kept between runs. Downloaded at each run,
      # the image once came cut short (« Failed to download package archive », run 42693133222 of 2026-11-09): the check
      # could not run and nothing was published for that commit. With the cache the installer finds them in place.
      - name: Keep the emulator and its system image
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/system-images/android-34
            ~/android-sdk/emulator
          key: emulator-api34-google_apis-x86_64-v1

      - name: Check the APK on an emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/emulator/smoke.sh app/build/outputs/apk/release emulator-check

      - name: Upload the emulator check
        if: always() && steps.emulator.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emulator-check-release
          path: emulator-check/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: toolmap-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: toolmap-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload the R8 mapping (needed to read crash traces)
        if: ${{ inputs.minify }}
        uses: actions/upload-artifact@v4
        with:
          name: toolmap-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
