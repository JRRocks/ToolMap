name: iOS

# The iPhone app (P32, ADR-100, docs/plan-ios.md): Swift code with no code shared with Android, built and tested on a
# macOS runner only (the cloud sessions have neither Xcode nor a Swift compiler). Independent of the Android CI (ci.yml).
on:
  push:
    paths:
      - "ios/**"
      - "fixtures/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "fixtures/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  # Publishing the simulator app as the release ios-<version> (ADR-099); deleting the older iOS artifacts.
  contents: write
  actions: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ToolMapCore (macOS, then iPhone simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode, Swift and simulators
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes available

      # First check, with the compiler's own messages: build and test the package on the macOS host.
      - name: swift test (macOS)
        working-directory: ios/ToolMapCore
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/swift-test.log"
          if ! swift test 2>&1 | tee "$log"; then
            # The failures again at the end of the log, where they can be read without the whole log.
            echo "::group::Failures"
            grep -E "\.swift:[0-9]+:[0-9]+: (error|note: expanded code)|recorded an issue|Fatal error" "$log" | sed 's/^.*\/ToolMapCore\///' | sort -u | head -n 150 || true
            echo "::endgroup::"
            grep -E "\.swift:[0-9]+:[0-9]+: error|recorded an issue" "$log" | sed 's/^.*\/ToolMapCore\///' | sort -u | head -n 40 >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi
          grep -E "Test run with|Executed [0-9]+ test" "$log" | tail -n 5 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 ios/ci/pick_simulator.py)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The same tests in an iPhone simulator: the platform the app ships on.
      - name: xcodebuild test (iPhone simulator)
        working-directory: ios/ToolMapCore
        run: |
          scheme=ToolMapCore
          if xcodebuild -list | grep -q "ToolMapCore-Package"; then scheme=ToolMapCore-Package; fi
          log="$RUNNER_TEMP/xcodebuild-test.log"
          if ! xcodebuild test \
            -scheme "$scheme" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ToolMapCore.xcresult" > "$log" 2>&1; then
            grep -E "error:|failed|✘" "$log" | head -n 100 || true
            tail -n 150 "$log"
            exit 1
          fi
          grep -E "Test run with|Executed [0-9]+ test|\*\* TEST" "$log" | tail -n 5 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the logs and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-core-results
          path: |
            ${{ runner.temp }}/swift-test.log
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/ToolMapCore.xcresult
          if-no-files-found: ignore
          retention-days: 7

  app:
    name: ToolMap app (simulator build, screenshots, .app for Appetize)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: |
          brew install xcodegen
          cd ios/ToolMap
          xcodegen generate
          echo "version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)" >> "$GITHUB_ENV"

      # Both simulator architectures (arm64 and x86_64), unsigned: the build Appetize.io runs in a browser.
      - name: Build for the iPhone simulator
        working-directory: ios/ToolMap
        run: |
          log="$RUNNER_TEMP/xcodebuild-app.log"
          if ! xcodebuild build \
            -project ToolMap.xcodeproj \
            -scheme ToolMap \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO > "$log" 2>&1; then
            grep -E "error:" "$log" | sort -u | head -n 100 || true
            tail -n 120 "$log"
            exit 1
          fi
          grep -E "warning:" "$log" | grep -v "/SourcePackages/" | sort -u | head -n 40 || true
          echo "APP=$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/ToolMap.app" >> "$GITHUB_ENV"

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 ios/ci/pick_simulator.py)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Screenshots in the simulator
        run: bash ios/ci/screenshots.sh "${{ steps.simulator.outputs.udid }}" "$APP" "$RUNNER_TEMP/screenshots"

      - name: Zip the app for Appetize.io
        run: |
          zip="$RUNNER_TEMP/ToolMap-ios-simulator-$version.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          ls -l "$zip"

      # The account's artifact storage is shared with the Android APKs (docs/specs/release.md §1): keep only the newest
      # iOS app and screenshots.
      - name: Delete old iOS artifacts
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const old = all.filter((a) => a.name.startsWith("toolmap-ios-") && !a.expired);
            for (const a of old) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              core.info(`Deleted ${a.name} ${a.id} (run ${a.workflow_run?.id})`);
            }

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: toolmap-ios-simulator-app
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: toolmap-ios-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error

      # Like android-<version> (ADR-099): the simulator app and its screenshots as the release ios-<version>, the two
      # newest versions kept. A version already published is kept as it is.
      - name: Publish the iOS release
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'dependabot/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published: kept as it is."
            exit 0
          fi
          published="$(gh release list --limit 100 --json tagName -q '.[].tagName | select(startswith("ios-"))')"
          gh release create "$tag" "$ZIP" "$RUNNER_TEMP"/screenshots/*.png --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "ToolMap iPhone $version (simulateur)" \
            --notes "Application iPhone $version pour le simulateur iOS, compilée par la CI depuis le commit ${GITHUB_SHA} (branche ${GITHUB_REF_NAME}). Non signée : elle s'ouvre dans le simulateur de Xcode ou dans le navigateur avec Appetize.io (téléverser le zip). Captures du simulateur jointes."
          for old in $(printf '%s\n' $published "$tag" | sort -uVr | tail -n +3); do
            gh release delete "$old" --cleanup-tag --yes
          done

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-log
          path: ${{ runner.temp }}/xcodebuild-app.log
          if-no-files-found: ignore
          retention-days: 7
